; Detected over serial: ESPink_V2, GDEY075Z08, 800x480, 3C, SHT4X.
; Upstream environments and their flags remain unchanged.
[env:espink_local_3c]
extends = env:espink
platform = espressif32@6.10.0
build_flags =
    -D BOARD_TYPE=ESPink_V2
    -D COLOR_TYPE=3C
    -D DISPLAY_TYPE=GDEY075Z08
    -D SENSOR
    -D SERVER_CONFIG_SERIAL
    -D FAST_CONNECT_SAFE_RESTART
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
